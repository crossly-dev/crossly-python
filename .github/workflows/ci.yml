# Build, test and package on every push (any branch) and pull request.
#
# Managed by tools/sdk-repo/seed.mjs in the Crossly monorepo: edits here are overwritten on the next seed.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: build seller
        run: bash codegen/ci/check.sh python seller
      - name: build buyer
        run: bash codegen/ci/check.sh python buyer
      - name: webhook conformance vectors
        working-directory: codegen/integrations/webhooks/python
        run: python check_vectors.py && python -m pip install -q flask django fastapi httpx && python ../../extras/python/selftest.py
      - name: package
        run: |
          python -m pip install -q build
          python -m build seller --outdir dist
          python -m build buyer --outdir dist
